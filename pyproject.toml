[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "research-agent"
version = "0.1.0"
description = "A bounded, evidence-first research agent with reproducible offline evaluation"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1",
  "typer>=0.15,<1", "rich>=13.9,<15", "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1", "trafilatura>=2,<3", "ddgs>=9,<10", "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "pytest-cov>=6,<8", "gnumake==4.4.1; sys_platform == 'win32'"]

[project.scripts]
research-agent = "research_agent.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["tmp", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"] # Ruff's formatter controls layout; long authored fixture strings stay intact.

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]
